name: Crypto News Bot

on:
  schedule:
    # Off the top of the hour: GitHub drops/delays scheduled runs at :00 under load.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: crypto-news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python bot.py

      - name: Commit updated state
        run: |
          git config user.name "crypto-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen.json
          git diff --staged --quiet && exit 0
          git commit -m "Update seen items state"
          git pull --rebase --quiet || true
          git push
